[workspace]
resolver = "3"
members = ["crates/waypoint-core", "crates/waypoint-gui", "crates/waypoint-tui"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# Let-chains are used throughout and stabilised here, in the 2024 edition only.
rust-version = "1.88"
license = "MIT"
authors = ["Arunkumar Mourougappane <amouroug.dev@gmail.com>"]
repository = "https://github.com/arunkumar-mourougappane/GN-183-Waypoint-rs"
homepage = "https://github.com/arunkumar-mourougappane/GN-183-Waypoint-rs"
keywords = ["nmea", "gps", "gnss", "tui", "debugger"]
categories = ["command-line-utilities", "science::geo", "visualization"]

[workspace.dependencies]
waypoint-core = { package = "gn183-waypoint-core", path = "crates/waypoint-core", version = "0.1.1" }

nmea = "0.8"
serialport = "4.9"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util", "macros"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
